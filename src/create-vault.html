<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
  <meta charset="UTF-8">
  <title>Create New Vault - Memoro Vault</title>

  <link id="theme-cypherpunk" rel="stylesheet" href="css/create-vault_cypherpunk.css">
<link id="theme-clean" rel="stylesheet" href="css/create-vault_clean.css" disabled>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="overlay"></div>

  <div class="content">
    <h1>Select the number of security questions</h1>
    <div class="slider-section">
      <span id="questionCount">14</span>
      <input type="range" id="questionSlider" min="4" max="25" value="14" oninput="updateQuestionCount()" />
    </div>

    <div class="button-container">
      <button class="button" onclick="goBack()">← Back</button>
      <button class="button" onclick="startVaultSetup()">Next</button>
    </div>
  </div>
  <script src="js/create-vault.js"></script>
</body>
</html>
